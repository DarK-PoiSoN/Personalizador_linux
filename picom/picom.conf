# Configuración del compositor (picom / compton)

backend = "xrender";
vsync = false;

# Repinta la pantalla completa en cada fotograma: evita que desaparezcan
# trozos de ventana en maquinas virtuales
use-damage = false;

# Las ventanas sin el foco se transparentan un poco. Un dialogo y su ventana
# principal cuentan como una sola, para que no se vea una a traves de la otra
# (no usar detect-client-leader: todas las terminales comparten proceso y
# contarian como una sola ventana con foco)
inactive-opacity = 0.80;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
detect-transient = true;
mark-ovredir-focused = false;  #Opción obligatoria para que funcione la opacidad
use-ewmh-active-win = true;

# Ventanas que nunca se transparentan
opacity-rule = [
	"100:class_g = 'Polybar'",
	"100:class_g = 'Rofi'",
	"100:class_g = 'i3lock'",
	"100:fullscreen",
	"100:window_type = 'dialog'",
	"100:window_type = 'menu'"
];

# Sombras
shadow = true;
shadow-opacity = 0.45;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-exclude = [
	"class_g = 'Polybar'",
	"_GTK_FRAME_EXTENTS@:c"
];

# Transiciones rapidas
fading = true;
fade-delta = 4;
fade-in-step = 0.08;
fade-out-step = 0.08;

wintypes:
{
	tooltip = { fade = true; shadow = false; focus = true; };
	dock = { shadow = false; focus = true; };
	dnd = { shadow = false; };
	popup_menu = { shadow = false; focus = true; };
	dropdown_menu = { shadow = false; focus = true; };
};
